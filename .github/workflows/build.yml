name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app's versionCode is the commit count.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bezel-town-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Every main build replaces the "latest" release, so this link always
      # serves the newest APK:
      # https://github.com/mikeyd433/WatchGameNumberOne/releases/download/latest/bezel-town.apk
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bezel-town.apk
          version="0.1.$(git rev-list --count HEAD)"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest bezel-town.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build ($version)" \
            --notes "Debug build of $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
