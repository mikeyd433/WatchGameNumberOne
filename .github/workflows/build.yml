name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push cancels older runs on the same branch, so an old build can never
# finish last and overwrite the "latest" release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the app's versionCode is the commit count.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test

      # Release build: optimized and much faster on the watch. Signed with the
      # shared debug key, so it installs over any earlier build.
      - name: Build APK
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: bezel-town-apk
          path: app/build/outputs/apk/release/*.apk

      # Every main build replaces the "latest" release, so this link always
      # serves the newest APK:
      # https://github.com/mikeyd433/WatchGameNumberOne/releases/download/latest/bezel-town.apk
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk bezel-town.apk
          version="0.1.$(git rev-list --count HEAD)"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest bezel-town.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build ($version)" \
            --notes "Build of $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
